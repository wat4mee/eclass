{% extends "base.html" %}
{% block title %}{{ title }} · {{ app_name }}{% endblock %}
{% block content %}
<section class="card error-card solo reveal">
  <div class="code display">{{ code }}</div>
  <h2>{{ title }}</h2>
  <p class="muted">{{ text }}</p>
  <a class="btn accent" href="{{ url_for('dashboard.home') }}"><svg class="ico"><use href="#i-home"/></svg>{{ t('err.home') }}</a>
</section>
{% endblock %}
